{% if page.paginator.num_pages > 1 %}<nav class="market-pagination" aria-label="ページネーション">{% if page.has_previous %}<a href="?q={{ request.GET.q|urlencode }}&branch={{ request.GET.branch|urlencode }}&page={{ page.previous_page_number }}">← 前へ</a>{% endif %}<span>{{ page.number }} / {{ page.paginator.num_pages }}</span>{% if page.has_next %}<a href="?q={{ request.GET.q|urlencode }}&branch={{ request.GET.branch|urlencode }}&page={{ page.next_page_number }}">次へ →</a>{% endif %}</nav>{% endif %}
