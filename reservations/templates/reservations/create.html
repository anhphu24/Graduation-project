{% extends 'customer_base.html' %}
{% block title %}商品予約｜食品ロス削減{% endblock %}
{% block page_content %}
<main class="customer-main customer-main--centered">
  <section class="customer-panel customer-panel--empty" aria-labelledby="reservation-title">
    <span class="customer-empty-icon" aria-hidden="true">🛍️</span>
    <p class="customer-eyebrow">RESERVATION</p>
    <h1 id="reservation-title">商品予約</h1>
    <p>商品詳細から数量を選択して予約してください。</p>
    <a class="customer-button" href="{% url 'products:list' %}">商品を探す</a>
  </section>
</main>
{% endblock %}
