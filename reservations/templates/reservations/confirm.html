{% extends 'customer_base.html' %}
{% block title %}予約確認｜食品ロス削減{% endblock %}
{% block page_content %}
<main class="customer-main customer-main--centered">
  <section class="customer-panel customer-panel--empty" aria-labelledby="confirmation-title">
    <span class="customer-empty-icon" aria-hidden="true">✅</span>
    <p class="customer-eyebrow">CONFIRMATION</p>
    <h1 id="confirmation-title">予約確認</h1>
    <p>予約状況と受取コードは予約履歴から確認できます。</p>
    <a class="customer-button" href="{% url 'market:orders' %}">予約履歴・状況を見る</a>
  </section>
</main>
{% endblock %}
