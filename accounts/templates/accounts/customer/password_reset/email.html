<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>パスワード再設定のご案内</title>
</head>
<body style="margin:0;padding:24px;background:#f7f4ee;color:#26332f;font-family:'Noto Sans JP',Arial,sans-serif;line-height:1.8;">
  <div style="max-width:600px;margin:0 auto;padding:32px;background:#ffffff;border:1px solid #d9e3db;border-radius:16px;">
    <p style="margin:0 0 20px;color:#146c5b;font-size:20px;font-weight:700;">🌿 Food Rescue</p>
    <h1 style="margin:0 0 18px;font-size:24px;">パスワード再設定のご案内</h1>
    <p>パスワード再設定のリクエストを受け付けました。次のボタンから新しいパスワードを設定してください。</p>
    <p style="margin:28px 0;text-align:center;">
      <a href="{{ protocol }}://{{ domain }}{% url 'accounts:customer_password_reset_confirm' uidb64=uid token=token %}" style="display:inline-block;padding:13px 22px;border-radius:12px;background:#146c5b;color:#ffffff;text-decoration:none;font-weight:700;">新しいパスワードを設定</a>
    </p>
    <p>このリンクの有効期限は<strong>{{ password_reset_timeout_minutes }}分</strong>です。</p>
    <p style="color:#68766e;font-size:14px;">このメールに心当たりがない場合は、何もせず破棄してください。現在のパスワードは変更されません。</p>
  </div>
</body>
</html>
