{% extends 'customer_auth_base.html' %}

{% load static %}

{% block title %}ログアウト完了｜食品ロス削減アプリ{% endblock %}

{% block page_content %}

<main class="page">

    <!-- 左側の紹介エリア -->
    <section class="hero">
        <span class="tag">🌿 FOOD RESCUE</span>

        <h1>
            まだおいしいを、<br />
            <em>もっと身近に。</em>
        </h1>

        <p>
            おトクに選んで、おいしく楽しむ。
            毎日の小さな選択が、食品ロスを減らす一歩に。
        </p>

        <div class="illustration" aria-hidden="true">
            <div class="blob"></div>
            <span class="leaf one">🌿</span>
            <span class="food">🥕</span>
            <span class="leaf two">🍃</span>
        </div>
    </section>

    <!-- ログアウト完了エリア -->
    <section class="auth-card signup">

        <div class="customer-completion">

            <!-- 完了アイコン -->
            <div class="customer-completion__icon" aria-hidden="true">
                ✓
            </div>

            <h2 class="customer-completion__title">
                ログアウトが完了しました
            </h2>

            <!-- ログイン画面へ移動 -->
            <a href="{% url 'accounts:customer_login' %}"
               class="btn coral customer-completion__action">
                ログイン画面へ
                <span aria-hidden="true">→</span>
            </a>

        </div>

    </section>

</main>

{% endblock %}
