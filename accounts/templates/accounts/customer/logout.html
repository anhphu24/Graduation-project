{% extends 'base.html' %}

{% block title %}ログアウト確認 | 食品ロス削減アプリ{% endblock %}

{% block body_class %}{% endblock %}

{% block body %}
<header class="logout-header">

    <main class="logout-container">

        <p>ログアウトしますか？</p>

        <div class="logout-buttons">

          <a href="{% url 'accounts:mypage' %}" class="logout-button cancel-button">

        </div>
      </section>

{% endblock %}
