<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#146C5B" />
    <title>店舗ログイン｜食品ロス削減アプリ</title>
    <link rel="stylesheet" href="../css/style.css" />
    <script defer src="../js/demo.js"></script>
  </head>
  <body class="shop">
    <header class="topbar">
      <a class="brand" href="login.html"
        ><span class="brand-mark">✿</span
        ><span
          >食品ロス削減<span
            style="display: block; font-size: 10px; font-weight: 500"
            >店舗管理システム</span
          ></span
        ></a
      >
    </header>
    <main class="page">
      <section class="hero">
        <span class="tag">🏪 SHOP PARTNER</span>
        <h1>お店の「もったいない」を<br /><em>価値に変える。</em></h1>
        <p>商品と予約をスマートに管理。食品ロスを減らす、新しいお店の習慣。</p>
        <div class="illustration" aria-hidden="true">
          <div class="blob"></div>
          <span class="leaf one">🌿</span><span class="food">🏪</span
          ><span class="leaf two">🍃</span>
        </div>
      </section>
      <section class="auth-card">
        <h2>店舗ログイン</h2>
        <p class="subtitle">お店の管理画面にログインします。</p>
        <form data-demo>
          <div class="field">
            <label for="email">メールアドレス</label
            ><input
              id="email"
              name="email"
              type="email"
              placeholder="example@email.com"
              required
              autocomplete="username"
            />
          </div>
          <div class="field">
            <label for="password">パスワード</label
            ><input
              id="password"
              name="password"
              type="password"
              placeholder="8文字以上"
              required
              autocomplete="current-password"
            />
          </div>
          <div class="field-row">
            <a href="forgot.html">パスワードを忘れた方</a>
          </div>
          <button type="submit" class="btn">
            ログインする <span aria-hidden="true">→</span>
          </button>
          <p class="message" role="status" aria-live="polite"></p>
        </form>
        <p class="footnote"><a href="contact.html">お問い合わせ</a></p>
      </section>
    </main>
  </body>
</html>
