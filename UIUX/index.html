.entry-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px;position:relative;overflow:hidden}.entry-wrap:before,.entry-wrap:after{content:"";position:absolute;border-radius:50%;pointer-events:none}.entry-wrap:before{width:340px;height:340px;background:#d7eade88;top:-130px;left:-110px}.entry-wrap:after{width:310px;height:310px;background:#ffddce88;bottom:-135px;right:-100px}.entry-panel{position:relative;z-index:1;width:min(860px,100%);text-align:center}.entry-logo{width:66px;height:66px;margin:0 auto 16px;display:grid;place-items:center;background:#146C5B;color:white;border-radius:22px;font-size:31px;box-shadow:0 14px 28px #146c5b35}.entry-title{font-size:clamp(25px,4vw,38px);color:#0F5B4E;margin:0 0 8px;font-weight:800}.entry-sub{color:#65746c;font-size:14px;margin:0 0 30px}.entry-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}.entry-card{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:35px 22px 29px;border-radius:26px;background:#fffdf9;border:1px solid #e3e8df;box-shadow:0 18px 44px #244d3c15;color:#26332F;transition:transform .23s,box-shadow .23s;text-decoration:none!important;animation:rise .6s both}.entry-card:nth-child(2){animation-delay:.1s;background:#f1f8f5}.entry-card:hover{transform:translateY(-5px);box-shadow:0 24px 50px #244d3c27}.entry-icon{width:88px;height:88px;border-radius:27px;display:grid;place-items:center;background:#ddefe6;font-size:42px}.entry-card:nth-child(2) .entry-icon{background:#d4ebe5}.entry-card h2{font-size:22px;margin:5px 0 0;color:#115e50}.entry-card p{font-size:13px;line-height:1.8;color:#63746c;margin:0 0 8px;font-weight:400}.entry-action{display:block;width:min(240px,100%);background:#146C5B;color:#fff;padding:13px 20px;border-radius:13px;font-weight:800}.entry-card:first-child .entry-action{background:#FF785A}.entry-foot{font-size:12px;color:#69776f;margin-top:26px}@media(max-width:620px){.entry-cards{grid-template-columns:1fr;gap:16px}.entry-card{padding:23px 18px}.entry-icon{width:66px;height:66px;font-size:33px}.entry-wrap{align-items:flex-start;padding-top:45px}}

</style></head><body><main class="entry-wrap"><div class="entry-panel"><div class="entry-logo" aria-hidden="true">🌿</div><h1 class="entry-title">食品ロス削減</h1><p class="entry-sub">おいしいを、ムダにしない。</p><div class="entry-cards"><a class="entry-card" href="customer/login.html" aria-label="利用者のログイン画面へ"><span class="entry-icon" aria-hidden="true">🛍️</span><h2>利用者の方</h2><p>おトクな食品を探して、<br>毎日のお買い物をもっと楽しく。</p><span class="entry-action">利用者ログインへ →</span></a><a class="entry-card" href="shop/login.html" aria-label="店舗のログイン画面へ"><span class="entry-icon" aria-hidden="true">🏪</span><h2>店舗の方</h2><p>商品の登録や予約の確認など、<br>お店の管理はこちらから。</p><span class="entry-action">店舗ログインへ →</span></a></div><p class="entry-foot">ご利用になる方を選択してください。</p></div></main></body></html>
