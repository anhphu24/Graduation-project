<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#146C5B" />
    <title>パスワード再設定｜食品ロス削減アプリ</title>
    <link rel="stylesheet" href="../css/style.css" />
    <script defer src="../js/demo.js"></script>
  </head>
  <body class="customer">
    <header class="topbar">
      <a class="brand" href="login.html"
        ><span class="brand-mark">✿</span
        ><span
          >食品ロス削減<span
            style="display: block; font-size: 10px; font-weight: 500"
            >おいしいを、ムダにしない。</span
          ></span
        ></a
      >
    </header>
    <main class="page">
      <section class="hero">
        <span class="tag">🌿 FOOD RESCUE</span>
        <h1>まだおいしいを、<br /><em>もっと身近に。</em></h1>
        <p>
          おトクに選んで、おいしく楽しむ。毎日の小さな選択が、食品ロスを減らす一歩に。
        </p>
        <div class="illustration" aria-hidden="true">
          <div class="blob"></div>
          <span class="leaf one">🌿</span><span class="food">✉️</span
          ><span class="leaf two">🍃</span>
        </div>
      </section>
      <section class="auth-card">
        <h2>パスワードの再設定</h2>
        <p class="subtitle">
          ご登録のメールアドレスに再設定用リンクをお送りします。
        </p>
        <form data-demo>
          <div class="field">
            <label for="email">登録済みメールアドレス</label
            ><input
              id="email"
              name="email"
              type="email"
              placeholder="example@email.com"
              required
            />
          </div>
          <button type="submit" class="btn">
            再設定用リンクを送信 <span aria-hidden="true">→</span>
          </button>
          <p class="message" role="status" aria-live="polite"></p>
        </form>
        <p class="footnote"><a href="login.html">← ログイン画面に戻る</a></p>
      </section>
    </main>
  </body>
</html>
