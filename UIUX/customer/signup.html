<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#146C5B" />

    <title>新規会員登録｜食品ロス削減アプリ</title>

    <link rel="stylesheet" href="../css/style.css" />
    <script defer src="../js/demo.js"></script>
  </head>

  <body class="customer">
    <header class="topbar">
      <a class="brand" href="login.html">
        <span class="brand-mark">✿</span>
        <span>
          食品ロス削減
          <span style="display: block; font-size: 10px; font-weight: 500">
            おいしいを、ムダにしない。
          </span>
        </span>
      </a>
    </header>

    <main class="page">
      <section class="hero">
        <span class="tag">🌿 FOOD RESCUE</span>

        <h1>
          まだおいしいを、<br />
          <em>もっと身近に。</em>
        </h1>

        <p>
          おトクに選んで、おいしく楽しむ。
          毎日の小さな選択が、食品ロスを減らす一歩に。
        </p>

        <div class="illustration" aria-hidden="true">
          <div class="blob"></div>
          <span class="leaf one">🌿</span>
          <span class="food">🥕</span>
          <span class="leaf two">🍃</span>
        </div>
      </section>

      <section class="auth-card signup">
        <h2>新規会員登録</h2>

        <p class="subtitle">
          アカウントを作成して、おトクな食品を見つけましょう！
        </p>

        <form data-demo>
          <!-- 氏名 -->
          <div class="two">
            <div class="field">
              <label for="family">姓</label>
              <input
                id="family"
                name="family"
                type="text"
                placeholder="山田"
                required
              />
            </div>

            <div class="field">
              <label for="given">名</label>
              <input
                id="given"
                name="given"
                type="text"
                placeholder="花子"
                required
              />
            </div>
          </div>

          <!-- フリガナ -->
          <div class="two">
            <div class="field">
              <label for="family_kana"> セイ（カタカナ） </label>
              <input
                id="family_kana"
                name="family_kana"
                type="text"
                placeholder="ヤマダ"
                required
              />
            </div>

            <div class="field">
              <label for="given_kana"> メイ（カタカナ） </label>
              <input
                id="given_kana"
                name="given_kana"
                type="text"
                placeholder="ハナコ"
                required
              />
            </div>
          </div>

          <!-- メールアドレス -->
          <div class="field">
            <label for="email">メールアドレス</label>
            <input
              id="email"
              name="email"
              type="email"
              placeholder="example@email.com"
              required
              autocomplete="email"
            />
          </div>

          <!-- パスワード -->
          <div class="field">
            <label for="password">パスワード</label>
            <input
              id="password"
              name="password"
              type="password"
              placeholder="8文字以上"
              minlength="8"
              required
              autocomplete="new-password"
            />
          </div>

          <!-- パスワード確認 -->
          <div class="field">
            <label for="password_confirm"> パスワード（確認） </label>
            <input
              id="password_confirm"
              name="password_confirm"
              type="password"
              placeholder="もう一度入力"
              minlength="8"
              required
              autocomplete="new-password"
            />
          </div>

          <!-- 性別：必須 -->
          <span class="label">性別（必須）</span>

          <div class="options" role="group" aria-label="性別（必須）">
            <label class="option">
              <input type="radio" name="gender" value="male" required />
              男性
            </label>

            <label class="option">
              <input type="radio" name="gender" value="female" />
              女性
            </label>

            <label class="option">
              <input type="radio" name="gender" value="other" />
              その他
            </label>
          </div>

          <!-- 登録ボタン -->
          <button type="submit" class="btn coral" style="margin-top: 25px">
            登録する
            <span aria-hidden="true">→</span>
          </button>
          <p class="message" role="status" aria-live="polite"></p>
        </form>

        <p class="footnote">
          すでにアカウントをお持ちの方
          <a href="login.html">ログイン</a>
        </p>
      </section>
    </main>
  </body>
</html>
