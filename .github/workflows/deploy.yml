name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      operation:
        description: Deploy main or roll back code to an older main commit
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - rollback
      target_sha:
        description: Full 40-character SHA; required only for rollback
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: food-rescue-production
  cancel-in-progress: false

jobs:
  test:
    name: Test production candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-with-at-least-fifty-characters-123456789
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: testserver,localhost,127.0.0.1
    steps:
      - name: Check out main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run project checks and tests
        run: bash scripts/run_ci.sh

  resolve-target:
    name: Resolve deployment SHA
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.target.outputs.mode }}
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - name: Check out main history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate target against origin/main
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_MODE: ${{ inputs.operation }}
          REQUESTED_SHA: ${{ inputs.target_sha }}
          PUSH_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          origin_main="$(git rev-parse origin/main)"

          if [[ "$EVENT_NAME" == "push" ]]; then
            mode="deploy"
            target="$PUSH_SHA"
            [[ "$target" == "$origin_main" ]] || {
              echo "Push SHA does not match origin/main." >&2
              exit 1
            }
          elif [[ "$REQUESTED_MODE" == "rollback" ]]; then
            mode="rollback"
            target="$REQUESTED_SHA"
            [[ "$target" =~ ^[0-9a-f]{40}$ ]] || {
              echo "Rollback requires a full 40-character commit SHA." >&2
              exit 1
            }
            git cat-file -e "${target}^{commit}"
            git merge-base --is-ancestor "$target" "$origin_main" || {
              echo "Rollback target is not in origin/main history." >&2
              exit 1
            }
          else
            mode="deploy"
            target="$origin_main"
          fi

          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "sha=$target" >> "$GITHUB_OUTPUT"
          echo "Selected $mode target: $target"

  deploy:
    name: Deploy through AWS Systems Manager
    needs:
      - test
      - resolve-target
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: production
      url: ${{ vars.PRODUCTION_HEALTHCHECK_URL }}
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      EC2_APP_USER: ${{ vars.EC2_APP_USER || 'ubuntu' }}
      EC2_APP_DIR: /var/www/food-rescue
      PRODUCTION_HEALTHCHECK_URL: ${{ vars.PRODUCTION_HEALTHCHECK_URL }}
      TARGET_SHA: ${{ needs.resolve-target.outputs.sha }}
      DEPLOY_MODE: ${{ needs.resolve-target.outputs.mode }}
    steps:
      - name: Check out deployment tooling from main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in AWS_REGION AWS_ROLE_TO_ASSUME EC2_INSTANCE_ID PRODUCTION_HEALTHCHECK_URL; do
            [[ -n "${!name:-}" ]] || {
              echo "Missing GitHub Actions variable: $name" >&2
              exit 1
            }
          done

      - name: Authenticate to AWS with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: food-rescue-${{ github.run_id }}
          role-duration-seconds: 3600
          mask-aws-account-id: true
          unset-current-credentials: true

      - name: Deploy exact commit through SSM Run Command
        shell: bash
        run: |
          bash scripts/ssm_deploy.sh \
            --instance-id "$EC2_INSTANCE_ID" \
            --app-user "$EC2_APP_USER" \
            --app-dir "$EC2_APP_DIR" \
            --expected-sha "$TARGET_SHA" \
            --mode "$DEPLOY_MODE"

      - name: Verify public health endpoint
        shell: bash
        run: |
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 5 --retry-all-errors \
            --max-time 15 "$PRODUCTION_HEALTHCHECK_URL"
