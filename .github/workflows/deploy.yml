name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      operation:
        description: Deploy main or roll back code to an older main commit
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - rollback
      target_sha:
        description: Full 40-character SHA; required only for rollback
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: food-rescue-production
  cancel-in-progress: false

jobs:
  resolve-target:
    name: Resolve deployment SHA
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.target.outputs.mode }}
      sha: ${{ steps.target.outputs.sha }}
      main_sha: ${{ steps.target.outputs.main_sha }}
    steps:
      - name: Check out main history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Validate target against origin/main
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_MODE: ${{ inputs.operation }}
          REQUESTED_SHA: ${{ inputs.target_sha }}
          PUSH_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          bash scripts/resolve_deploy_target.sh

  test:
    name: Test selected production candidate
    needs: resolve-target
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-with-at-least-fifty-characters-123456789
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: testserver,localhost,127.0.0.1
      DJANGO_EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
    steps:
      - name: Check out selected candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.resolve-target.outputs.sha }}
          path: candidate
          persist-credentials: false

      - name: Check out reviewed deployment tooling
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.resolve-target.outputs.main_sha }}
          path: tooling
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: candidate/requirements.txt

      - name: Install candidate dependencies
        run: python -m pip install --disable-pip-version-check -r candidate/requirements.txt

      - name: Test the exact selected candidate
        run: bash tooling/scripts/run_ci.sh --project-root candidate --django-only

      - name: Test deployment tooling from main
        run: bash tooling/scripts/run_ci.sh --project-root tooling --deployment-only

  deploy:
    name: Deploy through SSH
    needs:
      - resolve-target
      - test
    if: >-
      needs.resolve-target.result == 'success' &&
      needs.test.result == 'success' &&
      vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment:
      name: production
      url: ${{ vars.PRODUCTION_HEALTHCHECK_URL }}
    permissions:
      contents: read
    env:
      DEPLOY_HOST: ${{ vars.EC2_SSH_HOST }}
      DEPLOY_SSH_PORT: ${{ vars.EC2_SSH_PORT || '22' }}
      DEPLOY_USER: ubuntu
      SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.EC2_SSH_KNOWN_HOSTS }}
      TARGET_SHA: ${{ needs.resolve-target.outputs.sha }}
      MAIN_SHA: ${{ needs.resolve-target.outputs.main_sha }}
      DEPLOY_MODE: ${{ needs.resolve-target.outputs.mode }}
      PRODUCTION_HEALTHCHECK_URL: ${{ vars.PRODUCTION_HEALTHCHECK_URL }}
      PRODUCTION_ROLLBACK_HEALTHCHECK_URL: ${{ vars.PRODUCTION_ROLLBACK_HEALTHCHECK_URL }}
    steps:
      - name: Check out reviewed deployment tooling
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.resolve-target.outputs.main_sha }}
          persist-credentials: false

      - name: Validate deployment configuration
        shell: bash
        env:
          DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_ENABLED" == "true" ]] || exit 1
          for name in DEPLOY_HOST SSH_PRIVATE_KEY SSH_KNOWN_HOSTS PRODUCTION_HEALTHCHECK_URL; do
            [[ -n "${!name:-}" ]] || { echo "Missing variable or secret: $name" >&2; exit 1; }
          done
          if [[ "$DEPLOY_MODE" == "rollback" && -z "$PRODUCTION_ROLLBACK_HEALTHCHECK_URL" ]]; then
            echo "Missing PRODUCTION_ROLLBACK_HEALTHCHECK_URL" >&2
            exit 1
          fi

      - name: Deploy exact validated SHA over SSH
        shell: bash
        run: bash scripts/ssh_deploy.sh

      - name: Verify public health endpoint
        shell: bash
        run: |
          set -euo pipefail
          healthcheck_url="$PRODUCTION_HEALTHCHECK_URL"
          if [[ "$DEPLOY_MODE" == "rollback" ]]; then
            healthcheck_url="$PRODUCTION_ROLLBACK_HEALTHCHECK_URL"
          fi
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 5 --retry-all-errors \
            --max-time 15 "$healthcheck_url"
