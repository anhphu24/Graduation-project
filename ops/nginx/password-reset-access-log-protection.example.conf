# EXAMPLE ONLY. This file is not loaded by the deployment scripts.
#
# Integrate the `map` into the effective Nginx `http {}` context and the
# conditional `access_log` into the Food Rescue `server {}` context. Keep the
# deployment's existing TLS, upstream, proxy, static-file, log destination and
# log-format settings. Static inspection of this example is insufficient:
# validate the merged effective configuration with `nginx -t` and staging
# requests. Neither this example nor access-log validation covers error logs.

# http {} context
#
# `$uri` excludes the query string. The negative lookahead excludes Django's
# literal session-backed token sentinel, so
# `/password-reset/<uidb64>/set-password/`, `done`, and `complete` keep their
# normal access logging. Other values in the route's `<token>` segment are
# treated as sensitive even when invalid. The optional trailing slash also
# covers the pre-redirect form of the same sensitive route.
map $uri $food_rescue_access_loggable {
    default 1;
    "~^/accounts/customer/password-reset/[^/]+/(?!set-password(?:/|$))[^/]+/?$" 0;
}

# Food Rescue server {} context
#
# Replace this destination and format with the existing server's values. Every
# active access_log for this server, including inherited or centralized logs,
# must either use the same condition or be disabled for the sensitive route.
access_log /var/log/nginx/food-rescue.access.log combined if=$food_rescue_access_loggable;

# This condition protects Nginx access logs only. It does not redact Nginx
# error logs, Gunicorn logs, systemd journal records, load-balancer/CDN/WAF
# logs, Django error logs, or external observability data. Inspect and test
# those sinks separately before production use.
