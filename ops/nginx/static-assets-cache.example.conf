# EXAMPLE ONLY -- NOT APPLIED. This file is not loaded or deployed automatically.
# Merge these locations into the effective Nginx server block only after
# confirming the actual STATIC_ROOT and running `nginx -t` on staging.
# The effective http/server configuration must also load `mime.types`.

# ManifestStaticFilesStorage puts a 12-character content hash immediately
# before the final extension. These immutable URLs may be cached for one year.
# Regex locations need a capture when `alias` is used.
location ~* ^/static/(?<hashed_static_asset>.+\.[0-9a-f]{12}\.(?:avif|css|gif|ico|jpe?g|js|png|svg|webp|woff2?|ttf|eot))$ {
    alias /var/www/food-rescue/staticfiles/$hashed_static_asset;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

# Unhashed URLs remain available for compatibility, but must not receive a
# long immutable lifetime. Missing files must return 404 rather than the app.
location /static/ {
    alias /var/www/food-rescue/staticfiles/;
    add_header Cache-Control "public, max-age=300" always;
}

# Nginx's static file handler returns 404 when the aliased file does not exist;
# do not add an application fallback to either location.

# Keep old hashed files in STATIC_ROOT through the rollback/cache retention
# window. Do not run collectstatic --clear against this shared live directory.
