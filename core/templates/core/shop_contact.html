{% extends 'shop_base.html' %}

{% load static %}

{% block title %}お問い合わせ｜食品ロス削減アプリ{% endblock %}

{% block page_content %}
<main class="page">
      <section class="hero">
        <span class="tag">🏪 SHOP PARTNER</span>
        <h1>お店の「もったいない」を<br /><em>価値に変える。</em></h1>
        <p>商品と予約をスマートに管理。食品ロスを減らす、新しいお店の習慣。</p>
        <div class="illustration" aria-hidden="true">
          <div class="blob"></div>
          <span class="leaf one">🌿</span><span class="food">💌</span
          ><span class="leaf two">🍃</span>
        </div>
      </section>
      <section class="auth-card">
        <h2>お問い合わせ</h2>
        <p class="subtitle">
          ご不明な点がございましたら、お気軽にご連絡ください。
        </p>
        <form data-demo>
          <div class="field">
            <label for="name">お名前</label
            ><input
              id="name"
              name="name"
              type="text"
              placeholder="山田 花子"
              required
            />
          </div>
          <div class="field">
            <label for="email">返信先メールアドレス</label
            ><input
              id="email"
              name="email"
              type="email"
              placeholder="example@email.com"
              required
            />
          </div>
          <div class="field">
            <label for="message">お問い合わせ内容</label
            ><textarea
              id="message"
              required
              placeholder="お問い合わせ内容をご入力ください"
            ></textarea>
          </div>
          <button type="submit" class="btn">
            内容を確認する <span aria-hidden="true">→</span>
          </button>
          <p class="message" role="status" aria-live="polite"></p>
        </form>
        <p class="footnote"><a href="{% url 'accounts:shop_login' %}">← ログイン画面に戻る</a></p>
      </section>
    </main>
{% endblock %}
