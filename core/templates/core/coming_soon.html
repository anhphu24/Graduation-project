{% extends 'customer_base.html' %}
{% block title %}{{ heading }}｜食品ロス削減{% endblock %}
{% block page_content %}
<main class="customer-main customer-main--centered">
  <section class="customer-panel customer-panel--empty" aria-labelledby="coming-soon-title">
    <span class="customer-empty-icon" aria-hidden="true">🌱</span>
    <p class="customer-eyebrow">COMING SOON</p>
    <h1 id="coming-soon-title">{{ heading }}</h1>
    <p>より使いやすい体験をお届けするため、現在このページを準備しています。</p>
  {% if request.user.is_authenticated %}
    <a class="customer-button" href="{% url 'products:top' %}">トップページに戻る</a>
  {% else %}
    <a class="customer-button" href="{% url 'products:list' %}">商品を探す</a>
  {% endif %}
  </section>
</main>
{% endblock %}
